name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - "--all-features"
          - "--no-default-features"
          - "--no-default-features --features zstd"
          - "--no-default-features --features bzip2"
          - "--no-default-features --features flate2"
          - "--no-default-features --features progress"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check ${{ matrix.features }}
      - name: Test
        run: cargo test ${{ matrix.features }}
      - name: Clippy
        run: cargo clippy ${{ matrix.features }}
      - name: Format
        run: cargo fmt --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-features
