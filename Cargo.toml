[package]
name = "fileutils"
version = "0.3.1"
edition = "2024"
description = "Personal file utils"
license = "MIT"
repository = "https://github.com/wheynelau/fileutils"
readme = "README.md"
keywords = ["jsonl", "zstd", "compression", "io"]
categories = ["compression", "filesystem"]

[dependencies]
bzip2 = { version = "0.6.1", optional = true }
flate2 = { version = "1.1.10", optional = true }
indicatif = { version = "0.18.6", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
zstd = { version = "0.14.2", optional = true, features = ["zstdmt"] }

[features]
default = ["zstd", "progress"]
zstd = ["dep:zstd"]
bzip2 = ["dep:bzip2"]
progress = ["dep:indicatif"]
flate2 = ["dep:flate2"]
